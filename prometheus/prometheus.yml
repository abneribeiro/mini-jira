global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The API's private metrics listener. Port 9091 is not published to the
  # host, so this is reachable from inside the compose network only.
  - job_name: minijira_api
    static_configs:
      - targets: ["api:9091"]
